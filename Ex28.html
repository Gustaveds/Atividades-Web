<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustando Tamanho de Imagem</title>
</head>
<body>
    <h1>Ajustes de Tamanho</h1>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg/280px-Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg" alt="Cristo Redentor no Rio de Janeiro" width="200" height="250">
    <p>Imagem com proporção mantida (200x250 pixels).</p>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg/280px-Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg" alt="Cristo Redentor no Rio de Janeiro" width="150" height="188">
    <p>Imagem menor, com proporção mantida (150x188 pixels).</p>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg/280px-Cristo_Redentor_-_Rio_de_Janeiro%2C_Brasil.jpg" alt="Cristo Redentor no Rio de Janeiro" width="100" height="200">
    <p>Imagem com proporções alteradas (100x200 pixels).</p>
</body>
</html>
