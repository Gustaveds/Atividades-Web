<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animais do Cerrado</title>
    <style>
        body {
            text-align: center; /* Centraliza as imagens horizontalmente */
        }
        img {
            display: block; /* Transforma imagens em elementos de bloco */
            margin: 10px auto; /* Adiciona margem vertical e centraliza horizontalmente */
            width: 300px; /* Define uma largura fixa para consistência */
            height: 200px; /* Define uma altura fixa para consistência */
            object-fit: cover; /* Garante que as imagens cubram a área sem distorção */
        }
    </style>
</head>
<body>
    <h1>Fauna do Cerrado Goiano</h1>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Chrysocyon_brachyurus_-_mane_wolf.jpg/640px-Chrysocyon_brachyurus_-_mane_wolf.jpg" alt="Lobo-guará, o maior canídeo da América do Sul">
    
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Giant_anteater_in_the_Pantanal.jpg/640px-Giant_anteater_in_the_Pantanal.jpg" alt="Tamanduá-bandeira caminhando pelo cerrado">
    
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/On%C3%A7a_pintada_no_caminho_do_Porto_Jofre.jpg/640px-On%C3%A7a_pintada_no_caminho_do_Porto_Jofre.jpg" alt="Onça-pintada, o maior felino das Américas">
</body>
</html>
